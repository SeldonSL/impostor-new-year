{% extends 'game/base.html' %}

{% block title %}Unirse a Partida{% endblock %}

{% block content %}
<div class="card">
    <h2>Unirse a Partida</h2>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="game_id">Código de Partida</label>
            <input type="text" id="game_id" name="game_id" maxlength="4" required placeholder="Ingresa el código de 4 letras" style="text-transform: uppercase; letter-spacing: 5px; text-align: center; font-size: 1.5rem;">
        </div>

        <div class="form-group">
            <label for="user_id">Selecciona Tu Nombre</label>
            <select id="user_id" name="user_id" required>
                <option value="">-- Elige tu nombre --</option>
                {% for user in users %}
                <option value="{{ user.id }}">
                    {% if user.first_name or user.last_name %}
                        {{ user.first_name }} {{ user.last_name }}
                    {% else %}
                        {{ user.username }}
                    {% endif %}
                </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn">Revelar Mi Rol</button>
    </form>

    <div class="nav-links">
        <a href="{% url 'home' %}" class="btn btn-secondary">Volver</a>
    </div>
</div>
{% endblock %}
