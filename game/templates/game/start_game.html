{% extends 'game/base.html' %}

{% block title %}Crear Partida{% endblock %}

{% block content %}
<div class="card">
    <h2>Crear Nueva Partida</h2>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="number_of_players">Número de Jugadores</label>
            <input type="number" id="number_of_players" name="number_of_players" min="2" max="20" required placeholder="Ingresa el número de jugadores">
        </div>

        <button type="submit" class="btn">Crear Partida</button>
    </form>

    <div class="nav-links">
        <a href="{% url 'home' %}" class="btn btn-secondary">Volver</a>
    </div>
</div>
{% endblock %}
